<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kviz iz hrvatske ćirilice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <img src="hrvcirpal-logo.jpg" alt="HRVĆIRPAL" class="header-logo">
  <h1></h1>
  <p>Kviz iz hrvatske ćirilice</p>
</header>

<div class="main-wrap">
<div class="container">

  <!-- START SCREEN -->
  <div id="startScreen" class="start-screen">
    <h2>Izaberi temu kviza</h2>
    <div class="topic-grid">
      <div class="topic-card" onclick="startQuiz('povijest')">
        <img src="ikone/povijest.png" alt="Povijest" class="icon-img"><span class="label">Opća povijest</span><span class="info">15 pitanja</span>
      </div>
      <div class="topic-card" onclick="startQuiz('spomenici')">
        <img src="ikone/spomenici.png" alt="Spomenici" class="icon-img"><span class="label">Spomenici</span><span class="info">10 pitanja</span>
      </div>
      <div class="topic-card" onclick="startQuiz('nazivi')">
        <img src="ikone/naziv.png" alt="Nazivi" class="icon-img"><span class="label">Nazivi</span><span class="info">8 pitanja</span>
      </div>
      <div class="topic-card" onclick="startQuiz('abeceda')">
        <img src="ikone/grafija.png" alt="Abeceda" class="icon-img"><span class="label">Grafija</span><span class="info">13 pitanja</span>
      </div>
      <div class="topic-card" onclick="startLetterQuiz()">
        <img src="ikone/nauci slova.png" alt="Nauči slova" class="icon-img"><span class="label">Nauči slova</span><span class="info">15 pitanja</span>
      </div>
      <div class="topic-card" onclick="startMatching()">
        <img src="ikone/spoji slova.png" alt="Spoji slova" class="icon-img"><span class="label">Spoji slova</span><span class="info">poveži ćirilicu s drugim pismima</span>
      </div>
    </div>
    <button class="mix-btn" onclick="startQuiz('mix')"><img src="ikone/kocka.png" alt="Kocka" class="mix-icon"> odigraj kviz sa svim pitanjima</button>
  </div>

  <!-- QUIZ AREA -->
  <div id="quizArea" class="quiz-area hidden">
    <div class="top-bar">
      <span class="progress-text" id="progressText"></span>
      <span class="score-badge" id="scoreBadge"><img src="ikone/score-badge.png" alt="Score" class="score-img"><span class="score-num" id="scoreNum">0</span></span>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    <div id="questionCard" class="q-card"><div class="inner"></div></div>
    <div class="controls">
      <button class="back-btn" onclick="backToStart()">← natrag</button>
    </div>
  </div>

  <!-- MATCHING GAME -->
  <div id="matchingArea" class="quiz-area hidden">
    <div class="match-mode-bar" id="matchModeBar">
      <button class="match-mode-btn active" data-mode="lat" onclick="setMatchMode('lat')">A ↔ Ć</button>
      <button class="match-mode-btn" data-mode="gla" onclick="setMatchMode('gla')">Ⰰ ↔ Ć</button>
      <button class="match-mode-btn" data-mode="all" onclick="setMatchMode('all')">sve troje</button>
    </div>
    <div class="top-bar">
      <span class="progress-text" id="matchProgress"></span>
      <span class="score-badge" id="matchScore"><img src="ikone/score-badge.png" alt="Score" class="score-img"><span class="score-num" id="matchScoreNum">0</span></span>
    </div>
    <div class="match-grid" id="matchGrid"></div>
    <div class="controls">
      <button class="match-reset" onclick="startMatching()">🔄 Nova runda</button>
      <button class="back-btn" onclick="backToStart()">← natrag</button>
    </div>
  </div>

  <!-- LETTER QUIZ -->
  <div id="letterQuizArea" class="quiz-area hidden">
    <div class="top-bar">
      <span class="progress-text" id="lqCounter"></span>
      <span class="score-badge" id="lqScore"><img src="ikone/score-badge.png" alt="Score" class="score-img"><span class="score-num" id="lqScoreNum">0</span></span>
    </div>
    <div class="letter-display-wrap">
      <div class="letter-big" id="letterBig"></div>
    </div>
    <div class="feedback-overlay" id="lqFeedback"></div>
    <div class="letter-options" id="lqOptions"></div>
    <div class="controls">
      <button class="next-btn" id="lqNextBtn" onclick="letterQuizNext()">Sljedeće →</button>
      <button class="back-btn" onclick="backToStart()">← natrag</button>
    </div>
  </div>

  <!-- END SCREEN -->
  <div id="endScreen" class="end-screen"></div>

</div>
</div>

<!-- FEEDBACK MODAL -->
<div id="feedbackModal" class="modal-overlay hidden">
  <div class="modal-box" id="modalBox">
    <div class="modal-content" id="modalContent"></div>
    <button class="next-btn show" id="modalNextBtn" onclick="modalNext()">sljedeće →</button>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox hidden" onclick="closeLightbox()">
  <div class="lightbox-stage" id="lightboxStage">
    <img id="lightboxImg" src="" alt="Uvećana slika" draggable="false">
    <div class="lightbox-zoom-hint" id="lightboxHint">klik za povećanje · dvoklik za izlaz · kotačić/pinch za zoom</div>
  </div>
  <div class="lightbox-cap" id="lightboxCap" onclick="event.stopPropagation()"></div>
  <button class="lightbox-close" onclick="event.stopPropagation(); closeLightbox()">✕</button>
</div>

<button class="mute-btn" id="muteBtn" onclick="toggleMute()" title="Uključi/isključi zvuk">🔊</button>

<script src="script.js"></script>
</body>
</html>
